name: Release Packaging

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Package & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Inno Setup
        uses: robinraju/release-downloader@v1.8
        with:
          repository: 'jrsoftware/issrc'
          latest: true
        continue-on-error: true

      - name: Restore Dependencies
        run: dotnet restore GlassFolders.sln

      - name: Build Release Binaries
        run: dotnet build GlassFolders.sln --configuration Release --no-restore -warnaserror

      - name: Execute Tests
        run: dotnet test GlassFolders.sln --configuration Release --no-build

      - name: Package Installer (Inno Setup)
        shell: powershell
        run: |
          mkdir -Force artifacts
          if (Get-Command iscc.exe -ErrorAction SilentlyContinue) {
            iscc.exe installer/GlassFolders.iss
          } else {
            Write-Host "Inno Setup not in PATH, creating release archive..."
            Compress-Archive -Path "src\GlassFolders.App\bin\Release\net10.0-windows\*" -DestinationPath "artifacts\GlassFolders-v1.0.0-win-x64.zip"
          }

      - name: Generate SHA256 Checksums
        shell: powershell
        run: |
          Get-ChildItem -Path artifacts/* -Include *.exe,*.zip | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath artifacts/SHA256SUMS.txt -Append -Encoding ascii
          }
          Get-Content artifacts/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} artifacts/* --title "GlassFolders ${{ github.ref_name }}" --generate-notes
