name: Release Packaging

on:
  push:
    tags:
      - 'v*'
  # A manual run does everything except publish, so a change to this file can be proven without tagging a release.
  workflow_dispatch:

jobs:
  release:
    name: Package & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore GlassFolders.sln

      - name: Build Release Binaries
        run: dotnet build GlassFolders.sln --configuration Release --no-restore -warnaserror

      - name: Execute Tests
        run: dotnet test GlassFolders.sln --configuration Release --no-build

      - name: Package Installer (Inno Setup)
        shell: powershell
        run: |
          # The windows-latest image ships Inno Setup. If it ever goes missing, stop here instead of
          # quietly publishing a zip in place of the installer.
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) { throw "iscc.exe (Inno Setup) was not found on this runner; refusing to publish without the installer." }
          mkdir -Force artifacts
          & $iscc.Source installer/GlassFolders.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Get-ChildItem artifacts -Filter *.exe)) { throw "No installer was written to artifacts/." }

      - name: Generate SHA256 Checksums
        shell: powershell
        run: |
          Get-ChildItem -Path artifacts/* -Include *.exe,*.zip | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath artifacts/SHA256SUMS.txt -Append -Encoding ascii
          }
          Get-Content artifacts/SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} artifacts/* --title "GlassFolders ${{ github.ref_name }}" --generate-notes
