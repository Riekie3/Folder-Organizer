name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify Solution
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore GlassFolders.sln

      - name: Build Solution (WarnAsError)
        run: dotnet build GlassFolders.sln --configuration Release --no-restore -warnaserror

      - name: Execute Unit Tests
        run: dotnet test GlassFolders.sln --configuration Release --no-build --verbosity normal
